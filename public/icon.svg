<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients simulating multi-spectral confocal microscopy -->
    <radialGradient id="bgGlow" cx="65%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1035" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#050814" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030408" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanAmbient" cx="25%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaAmbient" cx="80%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowAmbient" cx="70%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>

    <!-- Bioluminescent Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Axon Track Linear Gradients -->
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#facc15" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#fda4af" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="gradMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#c026d3" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#f0abfc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="gradLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#84cc16" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#bef264" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="#030408"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="512" height="512" rx="112" fill="url(#cyanAmbient)"/>
  <rect width="512" height="512" rx="112" fill="url(#magentaAmbient)"/>
  <rect width="512" height="512" rx="112" fill="url(#yellowAmbient)"/>

  <!-- Outer High-Tech Edge Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.25"/>
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- ==================== BACKGROUND NEURAL WEBS & DENDRITIC ARBOR ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <!-- Fine gossamer background mesh -->
    <path d="M 40 90 Q 90 140, 160 110 T 270 80 T 380 95 T 480 60" fill="none" stroke="#38bdf8" stroke-width="0.9"/>
    <path d="M 30 150 Q 120 180, 200 130 T 320 170 T 420 120 T 490 160" fill="none" stroke="#f472b6" stroke-width="1"/>
    <path d="M 40 220 Q 110 200, 190 240 T 310 210 T 400 250 T 480 210" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <path d="M 25 290 Q 140 320, 240 270 T 360 310 T 450 280 T 495 330" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <path d="M 35 370 Q 110 340, 190 380 T 300 350 T 410 390 T 485 360" fill="none" stroke="#fde047" stroke-width="1"/>
    <path d="M 40 440 Q 130 460, 230 420 T 350 450 T 440 430 T 490 460" fill="none" stroke="#4ade80" stroke-width="0.9"/>
  </g>

  <!-- ==================== HORIZONTAL PARALLEL AXON TRACKS (Directly from BlueBrain-002) ==================== -->
  <g filter="url(#softGlow)">
    <!-- Track 1: Amber Gold Axon Bundle (Top) -->
    <path d="M 28 112 C 120 118, 190 98, 280 115 S 370 125, 484 102" fill="none" stroke="url(#gradGold)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 40 106 C 140 112, 230 102, 330 110 S 430 118, 480 98" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.85"/>

    <!-- Track 2: Hot Pink / Magenta Axon Track -->
    <path d="M 24 165 C 130 160, 210 174, 310 162 S 410 156, 488 170" fill="none" stroke="url(#gradPink)" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M 35 163 C 125 159, 230 170, 340 160 S 440 164, 485 168" fill="none" stroke="#ffe4e6" stroke-width="1.4" stroke-opacity="0.9"/>

    <!-- Track 3: Electric Cyan Axon Highway -->
    <path d="M 20 216 C 110 225, 220 208, 320 220 S 420 212, 492 226" fill="none" stroke="url(#gradCyan)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 30 214 C 130 222, 240 210, 350 218 S 445 215, 488 224" fill="none" stroke="#cffafe" stroke-width="1.6" stroke-opacity="0.95"/>

    <!-- Track 4: Magenta / Fuchsia Core Highway -->
    <path d="M 22 268 C 125 260, 215 278, 315 264 S 405 258, 490 274" fill="none" stroke="url(#gradMagenta)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 32 266 C 135 258, 235 274, 345 262 S 435 266, 486 272" fill="none" stroke="#fae8ff" stroke-width="1.5" stroke-opacity="0.9"/>

    <!-- Track 5: Turquoise / Teal Axon Line -->
    <path d="M 24 322 C 115 330, 210 316, 310 326 S 425 320, 488 332" fill="none" stroke="url(#gradCyan)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 38 320 C 130 328, 235 318, 335 324 S 440 322, 482 330" fill="none" stroke="#e0f2fe" stroke-width="1.3" stroke-opacity="0.85"/>

    <!-- Track 6: Deep Pink / Violet Line -->
    <path d="M 26 376 C 120 370, 225 385, 330 372 S 430 368, 486 384" fill="none" stroke="url(#gradPink)" stroke-width="3.4" stroke-linecap="round"/>

    <!-- Track 7: Bright Lime / Yellow-Green Track (Bottom) -->
    <path d="M 28 434 C 110 442, 215 428, 315 438 S 420 430, 488 446" fill="none" stroke="url(#gradLime)" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M 36 432 C 130 438, 230 427, 330 436 S 430 433, 484 443" fill="none" stroke="#ecfccb" stroke-width="1.4" stroke-opacity="0.9"/>
  </g>

  <!-- ==================== INTRICATE DENDRITIC ARBORS & SYNAPTIC TREES ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Right Gold Neuron Dendrite Tree (Soma at 330, 105) -->
    <g stroke="#facc15" opacity="0.85">
      <path d="M 330 105 L 310 65 M 330 105 L 335 50 M 330 105 L 360 60 M 330 105 L 380 75 M 330 105 L 290 85" stroke-width="1.8"/>
      <path d="M 310 65 L 295 40 M 310 65 L 320 35 M 360 60 L 375 35 M 380 75 L 410 60" stroke-width="1.2"/>
      <path d="M 330 105 L 305 135 M 330 105 L 345 140 M 330 105 L 365 125" stroke-width="1.5"/>
    </g>

    <!-- Center-Right Hot Magenta Neuron Arbor (Soma at 435, 185) -->
    <g stroke="#f43f5e" opacity="0.9">
      <path d="M 435 185 L 400 150 M 435 185 L 420 135 M 435 185 L 460 145 M 435 185 L 475 165" stroke-width="2"/>
      <path d="M 400 150 L 380 130 M 400 150 L 390 115 M 460 145 L 485 130" stroke-width="1.2"/>
      <path d="M 435 185 L 395 210 M 435 185 L 415 230 M 435 185 L 465 220 M 435 185 L 480 205" stroke-width="2"/>
      <path d="M 415 230 L 395 255 M 465 220 L 485 245" stroke-width="1.2"/>
    </g>

    <!-- Mid-Right Cyan Neuron Tree (Soma at 460, 240) -->
    <g stroke="#38bdf8" opacity="0.9">
      <path d="M 460 240 L 425 225 M 460 240 L 430 260 M 460 240 L 440 280 M 460 240 L 485 265" stroke-width="2.2"/>
      <path d="M 425 225 L 395 230 M 430 260 L 405 285 M 440 280 L 425 315" stroke-width="1.4"/>
    </g>

    <!-- Bottom-Right Lime Neuron Starburst (Soma at 430, 440) -->
    <g stroke="#a3e635" opacity="0.9">
      <path d="M 430 440 L 390 415 M 430 440 L 405 400 M 430 440 L 440 395 M 430 440 L 465 410" stroke-width="2.2"/>
      <path d="M 390 415 L 365 405 M 405 400 L 390 380 M 440 395 L 450 365" stroke-width="1.3"/>
      <path d="M 430 440 L 395 470 M 430 440 L 420 485 M 430 440 L 455 480 M 430 440 L 475 465" stroke-width="2"/>
      <path d="M 395 470 L 370 490 M 455 480 L 470 500" stroke-width="1.2"/>
    </g>

    <!-- Mid-Left Chartreuse/Green Neuron (Soma at 145, 160) -->
    <g stroke="#84cc16" opacity="0.85">
      <path d="M 145 160 L 115 125 M 145 160 L 130 115 M 145 160 L 165 120 M 145 160 L 180 135" stroke-width="1.8"/>
      <path d="M 115 125 L 90 110 M 165 120 L 185 95" stroke-width="1.1"/>
      <path d="M 145 160 L 110 185 M 145 160 L 135 200 M 145 160 L 175 190" stroke-width="1.8"/>
    </g>

    <!-- Lower-Left Pink/Violet Neuron (Soma at 170, 360) -->
    <g stroke="#ec4899" opacity="0.85">
      <path d="M 170 360 L 135 330 M 170 360 L 155 320 M 170 360 L 195 325 M 170 360 L 210 345" stroke-width="1.8"/>
      <path d="M 135 330 L 110 320 M 195 325 L 215 305" stroke-width="1.1"/>
      <path d="M 170 360 L 130 385 M 170 360 L 160 405 M 170 360 L 200 395" stroke-width="1.8"/>
    </g>

    <!-- Center Bridge Filaments (Connecting Axon Tracks Vertically) -->
    <g stroke="#38bdf8" stroke-width="1.3" opacity="0.65">
      <path d="M 210 165 Q 235 190, 220 216"/>
      <path d="M 285 216 Q 270 240, 290 264"/>
      <path d="M 330 264 Q 355 295, 340 322"/>
      <path d="M 260 326 Q 240 350, 255 374"/>
    </g>
    <g stroke="#f472b6" stroke-width="1.3" opacity="0.65">
      <path d="M 170 216 Q 190 240, 175 264"/>
      <path d="M 380 264 Q 405 290, 390 322"/>
      <path d="M 200 326 Q 185 350, 205 374"/>
      <path d="M 320 374 Q 340 405, 325 434"/>
    </g>
  </g>

  <!-- ==================== GLOWING NEURON CELL BODIES (SOMAS) ==================== -->
  <g filter="url(#neonGlow)">
    <!-- Top-Right Gold Soma -->
    <circle cx="330" cy="105" r="9" fill="#facc15"/>
    <circle cx="330" cy="105" r="4.5" fill="#fef9c3"/>

    <!-- Mid-Left Green Soma -->
    <circle cx="145" cy="160" r="7.5" fill="#a3e635"/>
    <circle cx="145" cy="160" r="3.5" fill="#f7fee7"/>

    <!-- Upper-Right Magenta Soma -->
    <circle cx="435" cy="185" r="11" fill="#f43f5e"/>
    <circle cx="435" cy="185" r="5.5" fill="#fff1f2"/>

    <!-- Mid-Right Cyan Soma -->
    <circle cx="460" cy="240" r="10" fill="#22d3ee"/>
    <circle cx="460" cy="240" r="5" fill="#ecfeff"/>

    <!-- Lower-Left Magenta Soma -->
    <circle cx="170" cy="360" r="8" fill="#ec4899"/>
    <circle cx="170" cy="360" r="4" fill="#fdf2f8"/>

    <!-- Bottom-Right Lime Soma -->
    <circle cx="430" cy="440" r="11" fill="#84cc16"/>
    <circle cx="430" cy="440" r="5.5" fill="#f7fee7"/>

    <!-- Secondary Synaptic Nodes Along Tracks -->
    <circle cx="85" cy="112" r="3.5" fill="#facc15"/>
    <circle cx="205" cy="114" r="4" fill="#fef08a"/>
    <circle cx="400" cy="118" r="3.5" fill="#facc15"/>

    <circle cx="110" cy="164" r="3.8" fill="#f43f5e"/>
    <circle cx="260" cy="168" r="4.5" fill="#fda4af"/>
    <circle cx="360" cy="162" r="3.5" fill="#f43f5e"/>

    <circle cx="95" cy="216" r="4" fill="#38bdf8"/>
    <circle cx="215" cy="218" r="5" fill="#67e8f9"/>
    <circle cx="350" cy="214" r="4.5" fill="#22d3ee"/>

    <circle cx="120" cy="268" r="4.2" fill="#c026d3"/>
    <circle cx="240" cy="272" r="5" fill="#f0abfc"/>
    <circle cx="365" cy="264" r="4.5" fill="#e879f9"/>

    <circle cx="105" cy="324" r="3.8" fill="#06b6d4"/>
    <circle cx="225" cy="320" r="4.5" fill="#67e8f9"/>
    <circle cx="370" cy="324" r="4" fill="#38bdf8"/>

    <circle cx="90" cy="374" r="3.5" fill="#ec4899"/>
    <circle cx="270" cy="378" r="4.2" fill="#f472b6"/>
    <circle cx="390" cy="372" r="3.8" fill="#ec4899"/>

    <circle cx="115" cy="434" r="4" fill="#84cc16"/>
    <circle cx="230" cy="430" r="4.5" fill="#bef264"/>
    <circle cx="340" cy="436" r="4" fill="#a3e635"/>
  </g>
</svg>
